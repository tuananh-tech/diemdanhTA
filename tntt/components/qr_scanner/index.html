<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét QR</title>
<style>
  :root { --navy: #1B2A4A; --gold: #D4A017; --ok: #2E8B57; --warn: #D48A00; --err: #C0392B; --cream: #FBF7EE; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent;
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--navy); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #0E1626; border-radius: 16px;
    overflow: hidden; border: 4px solid #0E1626; transition: border-color .15s; }
  .stage.ok { border-color: var(--ok); } .stage.warn { border-color: var(--warn); } .stage.err { border-color: var(--err); }
  .stage.busy { border-color: var(--gold); }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guide { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .guide div { width: 62%; aspect-ratio: 1; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.28);
    border: 3px solid rgba(255,255,255,.85); }
  .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center;
    justify-content: center; color: #DDE3EE; text-align: center; padding: 18px; font-size: 15px; line-height: 1.45; }
  .placeholder svg { opacity: .8; }
  .flash { position: absolute; left: 10px; right: 10px; bottom: 10px; border-radius: 12px; padding: 12px 14px;
    color: #fff; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .flash.show { display: block; animation: pop .18s ease-out; }
  .flash.ok { background: var(--ok); } .flash.warn { background: var(--warn); } .flash.err { background: var(--err); }
  .flash .t { font-weight: 700; font-size: 17px; } .flash .s { font-size: 14px; opacity: .95; margin-top: 2px; }
  @keyframes pop { from { transform: scale(.96); opacity: .4 } to { transform: scale(1); opacity: 1 } }
  .bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 15px; border-radius: 10px; min-height: 44px; padding: 0 14px;
    border: 1px solid #CDD3DE; background: #fff; color: var(--navy); }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; flex: 1 1 160px; }
  button.primary.stop { background: #fff; color: var(--err); border-color: var(--err); }
  select { flex: 1 1 160px; min-width: 0; }
  .status { margin-top: 8px; font-size: 13px; color: #5A6478; display: flex; justify-content: space-between; gap: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9AA3B2; margin-right: 6px; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(46,139,87,.2); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="stage" class="stage">
    <video id="video" playsinline muted></video>
    <div id="guide" class="guide hidden"><div></div></div>
    <div id="placeholder" class="placeholder">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
      <div id="phText">Bấm <b>Bật camera</b> để bắt đầu quét.<br>Đưa thẻ QR vào khung, hệ thống tự ghi nhận liên tục.</div>
    </div>
    <div id="flash" class="flash"><div class="t" id="flashT"></div><div class="s" id="flashS"></div></div>
  </div>
  <div class="bar">
    <button id="toggle" class="primary" type="button">Bật camera</button>
    <select id="cams" class="hidden" aria-label="Chọn camera"></select>
    <button id="torch" class="hidden" type="button" aria-label="Đèn flash">🔦</button>
    <button id="sound" type="button" aria-label="Âm thanh">🔊</button>
  </div>
  <div class="status"><span><span id="dot" class="dot"></span><span id="statusText">Camera đang tắt</span></span><span id="engine"></span></div>
</div>
<canvas id="canvas" class="hidden"></canvas>
<script src="jsQR.js"></script>
<script>
(function () {
  "use strict";
  // ---- Giao thức Streamlit component (v1) ----
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*"); }
  // Đo chiều cao NỘI DUNG (không dùng documentElement.scrollHeight: giá trị này bằng chiều cao
  // iframe khi iframe cao hơn nội dung -> vòng lặp tự tăng chiều cao). Chỉ gửi khi thay đổi.
  var lastHeight = 0;
  function setHeight() {
    var h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height) + 4;
    if (h !== lastHeight) { lastHeight = h; send("streamlit:setFrameHeight", { height: h }); }
  }
  function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  var $ = function (id) { return document.getElementById(id); };
  var video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
  var stream = null, running = false, timer = null, detector = null;
  var lastText = "", lastTextAt = 0, pending = null, lastShownNonce = null, soundOn = true, audioCtx = null;
  var COOLDOWN_MS = 2500, INTERVAL_MS = 120, PENDING_TIMEOUT_MS = 6000;
  var LS_KEY = "tntt_scanner_camera";

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function status(text, live) { $("statusText").textContent = text; $("dot").className = "dot" + (live ? " live" : ""); }

  function beep(kind) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var seq = kind === "ok" ? [[880, .09], [1320, .12]] : kind === "warn" ? [[660, .1], [0, .06], [660, .1]] : [[220, .32]];
      var t = audioCtx.currentTime;
      seq.forEach(function (n) {
        if (n[0]) {
          var o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = kind === "err" ? "square" : "sine"; o.frequency.value = n[0];
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + n[1]);
          o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + n[1] + 0.02);
        }
        t += n[1];
      });
    } catch (e) { /* trình duyệt chặn âm thanh: bỏ qua */ }
    if (navigator.vibrate) navigator.vibrate(kind === "ok" ? 80 : kind === "warn" ? [60, 50, 60] : 300);
  }

  var flashTimer = null;
  function flash(kind, title, sub) {
    var f = $("flash");
    f.className = "flash show " + kind; $("flashT").textContent = title || ""; $("flashS").textContent = sub || "";
    $("stage").className = "stage " + kind;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { f.className = "flash"; $("stage").className = "stage"; }, kind === "ok" ? 1600 : 2600);
  }

  function kindClass(k) { return k === "success" ? "ok" : (k === "duplicate" ? "warn" : "err"); }

  // ---- Nhận kết quả xử lý từ Python ----
  function onRender(event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var args = data.args || {};
    var r = args.result;
    if (r && r.nonce && r.nonce !== lastShownNonce) {
      lastShownNonce = r.nonce;
      if (pending && pending.nonce === r.nonce) pending = null;
      var k = kindClass(r.kind);
      flash(k, r.title, r.subtitle);
      beep(k);
    }
    setHeight();
  }
  window.addEventListener("message", onRender);

  // ---- Camera ----
  function secureOk() {
    if (!window.isSecureContext) {
      $("phText").innerHTML = "Trình duyệt chỉ cho phép camera trên kết nối <b>HTTPS</b> (hoặc localhost).<br>Hãy mở website bằng địa chỉ https://… hoặc dùng ô <b>Nhập mã</b> bên dưới.";
      return false;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $("phText").innerHTML = "Trình duyệt này không hỗ trợ camera. Hãy dùng Chrome/Safari bản mới, hoặc dùng ô <b>Nhập mã</b>.";
      return false;
    }
    return true;
  }

  async function listCameras(activeId) {
    try {
      var devices = (await navigator.mediaDevices.enumerateDevices()).filter(function (d) { return d.kind === "videoinput"; });
      var sel = $("cams");
      sel.innerHTML = "";
      devices.forEach(function (d, i) {
        var o = document.createElement("option");
        o.value = d.deviceId; o.textContent = d.label || ("Camera " + (i + 1));
        if (d.deviceId === activeId) o.selected = true;
        sel.appendChild(o);
      });
      sel.classList.toggle("hidden", devices.length < 2);
    } catch (e) { /* bỏ qua */ }
  }

  async function start(deviceId) {
    if (!secureOk()) { setHeight(); return; }
    stop(true);
    status("Đang mở camera…", false);
    var constraints = deviceId
      ? { video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }
      : { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      if (deviceId) { store(LS_KEY, ""); return start(null); }
      var msg = e && e.name === "NotAllowedError" ? "Bạn đã từ chối quyền camera. Hãy cho phép camera trong cài đặt trình duyệt (biểu tượng ổ khóa cạnh địa chỉ web) rồi bấm lại."
        : e && e.name === "NotFoundError" ? "Không tìm thấy camera trên thiết bị này."
        : e && e.name === "NotReadableError" ? "Camera đang được ứng dụng khác sử dụng."
        : "Không mở được camera (" + (e && e.name) + ").";
      $("phText").innerHTML = msg + "<br>Có thể dùng ô <b>Nhập mã</b> bên dưới.";
      status("Không có camera", false); setHeight();
      return;
    }
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* iOS cần thao tác người dùng – đã có click */ }
    var track = stream.getVideoTracks()[0];
    var settings = track.getSettings ? track.getSettings() : {};
    if (settings.deviceId) store(LS_KEY, settings.deviceId);
    await listCameras(settings.deviceId);
    var caps = track.getCapabilities ? track.getCapabilities() : {};
    $("torch").classList.toggle("hidden", !caps.torch);
    $("placeholder").classList.add("hidden"); $("guide").classList.remove("hidden");
    $("toggle").textContent = "Tắt camera"; $("toggle").classList.add("stop");
    running = true; status("Đang quét – đưa mã QR vào khung", true);
    loop();
    setHeight();
  }

  function stop(silent) {
    running = false; clearTimeout(timer);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    $("guide").classList.add("hidden"); $("placeholder").classList.remove("hidden");
    $("toggle").textContent = "Bật camera"; $("toggle").classList.remove("stop"); $("torch").classList.add("hidden");
    if (!silent) status("Camera đang tắt", false);
  }

  // ---- Giải mã ----
  async function setupDetector() {
    if ("BarcodeDetector" in window) {
      try {
        var formats = await window.BarcodeDetector.getSupportedFormats();
        if (formats.indexOf("qr_code") >= 0) { detector = new window.BarcodeDetector({ formats: ["qr_code"] }); }
      } catch (e) { detector = null; }
    }
    $("engine").textContent = detector ? "BarcodeDetector" : "jsQR";
  }

  async function decodeFrame() {
    if (video.readyState < 2) return null;
    if (detector) {
      try {
        var codes = await detector.detect(video);
        if (codes && codes.length) return codes[0].rawValue;
        return null;
      } catch (e) { detector = null; $("engine").textContent = "jsQR"; }
    }
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    // chỉ xử lý vùng trung tâm (khung ngắm) ở độ phân giải vừa phải -> nhanh trên điện thoại yếu
    var side = Math.min(vw, vh) * 0.8, sx = (vw - side) / 2, sy = (vh - side) / 2, target = Math.min(640, side);
    canvas.width = target; canvas.height = target;
    ctx.drawImage(video, sx, sy, side, side, 0, 0, target, target);
    var img = ctx.getImageData(0, 0, target, target);
    var res = window.jsQR(img.data, target, target, { inversionAttempts: "dontInvert" });
    return res ? res.data : null;
  }

  async function loop() {
    if (!running) return;
    try {
      if (pending && Date.now() - pending.at > PENDING_TIMEOUT_MS) {
        pending = null; flash("err", "Mất kết nối máy chủ", "Chưa ghi nhận – hãy quét lại."); beep("err");
      }
      if (!pending) {
        var text = await decodeFrame();
        var now = Date.now();
        if (text && !(text === lastText && now - lastTextAt < COOLDOWN_MS)) {
          lastText = text; lastTextAt = now;
          var nonce = now.toString(36) + Math.random().toString(36).slice(2, 8);
          pending = { nonce: nonce, at: now };
          $("stage").className = "stage busy";
          setValue({ text: text, nonce: nonce });
        } else if (text) {
          lastTextAt = now;  // mã vẫn đang trong khung -> kéo dài thời gian chờ, không gửi lặp
        }
      }
    } catch (e) { /* bỏ qua khung hình lỗi */ }
    timer = setTimeout(loop, INTERVAL_MS);
  }

  // ---- Sự kiện ----
  $("toggle").addEventListener("click", function () {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
    if (running) stop(false); else start(store(LS_KEY) || null);
  });
  $("cams").addEventListener("change", function (e) { start(e.target.value); });
  $("sound").addEventListener("click", function () { soundOn = !soundOn; $("sound").textContent = soundOn ? "🔊" : "🔇"; });
  var torchOn = false;
  $("torch").addEventListener("click", async function () {
    if (!stream) return;
    torchOn = !torchOn;
    try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { torchOn = false; }
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && running) stop(false); });
  window.addEventListener("resize", setHeight);

  setupDetector();
  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
})();
</script>
</body>
</html>
